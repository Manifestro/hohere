name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - src/**
      - configs/**
      - scripts/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/manifestro/hohere

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Two CUDA envs (vLLM + Kokoro) do not fit on a stock runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          # The root disk still runs out; /mnt has ~70 GB free, so put Docker's storage there.
          sudo systemctl stop docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
