# hohere-2m, part 2 (v0.4): another 1,000,000 words on top of hohere-1m (v0.3).
# New topics (what people actually ask a voice assistant), new user personas, a skill mix
# shifted towards full-duplex behaviour, and near-duplicate checks against part 1.
# User (A, varied Kokoro voices) <-> AI assistant (B, Kokoro af_heart), same as part 1.

project:
  name: hohere-dataset
  seed: 43
  dataset_version: 0.4.0

dataset:
  target_hours: 20   # ignored when target_words is set
  target_words: 1000000
  language: en
  output_dir: ./data/v0.4
  cache_dir: ./data/cache
  id_prefix: conv2   # part 1 uses conv_NNNNNN
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  estimated_conversation_seconds: 60
  overprovision: 1.3
  skill_mix:
    simple_dialogue:     {share: 0.30, estimated_seconds: 70, estimated_words: 155, description: "Questions, answers, clarifications, short exchanges."}
    context_memory:      {share: 0.20, estimated_seconds: 105, estimated_words: 230, description: "Referring back to things said several turns earlier."}
    turn_taking:         {share: 0.15, estimated_seconds: 85, estimated_words: 185, description: "Varied pauses, hesitation, waiting for a reply."}
    backchannel:         {share: 0.15, estimated_seconds: 90, estimated_words: 200, description: "'mm-hm', 'right', 'I see' during the other's speech."}
    interruption:        {share: 0.15, estimated_seconds: 100, estimated_words: 220, description: "Stopping an answer, clarifying, changing direction."}
    incomplete_thoughts: {share: 0.05, estimated_seconds: 75, estimated_words: 165, description: "Self-correction, resuming an abandoned sentence."}
  topics:
    # Explaining and learning
    - explaining how compound interest works
    - why the sky is blue, explained simply
    - helping with a high school algebra problem
    - understanding a confusing word in a news article
    - how vaccines train the immune system, in plain words
    - the difference between weather and climate
    - learning to read sheet music
    - a quick history of the Roman Empire for a quiz
    - how a car engine works
    - practicing Spanish phrases before a trip
    - studying for a driving theory test
    - explaining a chess opening
    # Tech help
    - a phone that keeps running out of battery
    - setting up a new wireless printer
    - forgotten email password and account recovery
    - moving photos from an old phone to a new one
    - a laptop that is suddenly very slow
    - choosing a password manager
    - a suspicious text message that looks like a scam
    - connecting wireless earbuds that will not pair
    - setting up parental controls on a tablet
    - a spreadsheet formula that returns an error
    - backing up important documents
    - a video call with bad audio
    # Cooking step by step
    - cooking pasta carbonara step by step
    - baking bread for the first time
    - substituting eggs in a cake recipe
    - how long to roast a chicken
    - a sauce that is too salty
    - making a quick dinner from leftovers
    - converting cups to grams while baking
    - planning a vegetarian dinner party menu
    - making pancakes with a child
    - keeping herbs fresh longer
    # Day planning and reminders
    - planning a packed Saturday of errands
    - setting reminders for medication
    - fitting a workout into a busy week
    - scheduling a call across three time zones
    - preparing a checklist for moving day
    - a morning routine that keeps running late
    - planning a study timetable before exams
    - remembering friends' birthdays
    - organizing a family calendar
    - breaking a big work task into small steps
    # Travel on the spot
    - lost in a new city looking for the train station
    - missed connecting flight and what to do now
    - finding a pharmacy open late abroad
    - tipping customs in a foreign country
    - packing for a week of rainy weather
    - a hotel room that was double booked
    - renting a car for the first time
    - what to see in one afternoon in a new city
    - a passport that expires soon
    - jet lag after a long flight
    # Health and fitness, general information
    - a beginner running plan
    - stretching after sitting all day
    - drinking enough water during the day
    - a mild headache that will not go away
    - healthy snacks for work
    - starting yoga at home
    - understanding a food nutrition label
    - sleeping better before an early flight
    - recovering after a long hike
    - cutting down on coffee
    # Writing and communication
    - writing a polite complaint email
    - a toast for a best friend's wedding
    - a thank-you note to a teacher
    - asking a manager for a day off
    - a cover letter for a cafe job
    - replying to an awkward group chat message
    - a short speech for a retirement party
    - wording a message to a landlord about repairs
    - an apology to a friend after an argument
    - a product review for an online shop
    # Money and shopping
    - setting up a monthly budget
    - comparing two laptops for a student
    - whether to buy or lease a car
    - a subscription that charged twice
    - saving for a holiday in six months
    - choosing a birthday present under a budget
    - understanding a first payslip
    - buying a mattress online
    - splitting a restaurant bill between friends
    - returning shoes that do not fit
    # Home and everyday problems
    - a smoke alarm beeping in the middle of the night
    - getting rid of fruit flies in the kitchen
    - a stain on a white shirt
    - a houseplant with yellow leaves
    - a dishwasher leaving dishes dirty
    - choosing a vacuum cleaner for pet hair
    - keeping a small apartment warm in winter
    - assembling flat-pack furniture with missing screws
    - a dog that barks when left alone
    - preparing a home for a new kitten
    # Entertainment and hobbies
    - recommending a board game for four players
    - a book to read after finishing a fantasy series
    - starting a podcast as a hobby
    - learning to draw portraits
    - a playlist for a long drive
    - picking a first camera for photography
    - getting into birdwatching
    - planning a movie marathon night
    - the rules of cricket for a beginner
    - choosing a video game for a younger sibling
    # Small talk and companionship
    - chatting about a long and tiring day
    - talking through nerves before a first date
    - deciding between two job offers
    - feeling homesick after moving abroad
    - celebrating finally finishing a big project
    - a rainy Sunday with nothing planned
    - thinking about learning something new this year
    - a funny thing that happened at the supermarket
    - reflecting on a good weekend with family
    - motivation to clean the apartment
    # Work and study
    - preparing for a performance review
    - summarizing a long meeting for a colleague
    - handling a difficult customer on the phone
    - choosing a topic for a university essay
    - starting a side business selling crafts
    - preparing questions for an interviewer
    - giving feedback to a teammate
    - getting through a long reading list
    - first week at a new job
    - asking for an extension on a deadline

dialogue:
  provider: qwen
  model: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  base_url: null            # or $HOHERE_QWEN_BASE_URL, e.g. http://localhost:8000/v1
  temperature: 0.9
  top_p: 0.95
  concurrency: 48
  max_attempts: 5
  min_turns: 4
  max_turns: 20
  max_words_per_utterance: 60
  min_duration_seconds: 20
  max_duration_seconds: 180
  near_duplicate_threshold: 0.6
  # Part 1 texts: `hohere dialogues texts --repo-id manifestro/hohere-1m --out data/hohere-1m-texts.jsonl`
  dedup_against: [./data/hohere-1m-texts.jsonl]
  user_personas:
    - a commuter talking on the bus, in a hurry, keeps it short
    - a parent cooking with flour on their hands, asks to repeat steps
    - a pensioner who is new to smartphones, careful and polite
    - a high school student doing homework late at night, a bit tired
    - a nurse just off a long shift, warm but exhausted
    - a construction worker on a lunch break, plain and direct
    - a shy person who speaks quietly and trails off
    - a confident manager used to giving instructions, interrupts often
    - a tourist with basic English, short sentences, asks for simpler words
    - a curious child of about ten, asks "why" a lot
    - a perfectionist who double-checks every detail
    - a joker who makes small jokes and teases the assistant
    - a stressed freelancer juggling deadlines, thinks out loud
    - a new immigrant learning local customs, polite and curious
    - a gym enthusiast, energetic, talks fast
    - someone with a cold, slow and a bit grumpy
    - a grandparent asking on behalf of a grandchild
    - an indecisive person who changes their mind mid-sentence
    - a chef who knows food well and challenges the assistant's tips
    - a night owl chatting at 2 am who cannot sleep
    - a veteran gardener who loves long side stories
    - a university researcher, precise, asks follow-up questions
  llm_judge: false

speech:
  provider: kokoro
  model: hexgrad/Kokoro-82M
  sample_rate: 24000
  device: null              # auto: cuda if available
  # Speaker B = AI assistant (the model): always this voice and speed.
  model_voice: af_heart
  model_speed: 1.0
  # Speaker A = human user: one of these per conversation (never the model voice).
  user_voices: [af_bella, af_nicole, af_aoede, af_kore, af_sarah, af_alloy, af_nova,
                am_michael, am_fenrir, am_puck, am_echo, am_eric, am_liam, am_onyx,
                bf_emma, bf_isabella, bf_alice, bm_george, bm_fable, bm_lewis, bm_daniel]
  speed_min: 0.95
  speed_max: 1.05
  utterance_speed_jitter: 0.02
  trim_silence: true

timeline:
  lead_silence_ms: [200, 600]
  tail_silence_ms: [300, 800]
  normal_pause_ms: [200, 800]
  long_pause_ms: [1000, 2500]
  random_long_pause_prob: 0.05
  transition_overlap_prob: 0.08
  transition_overlap_ms: [50, 250]
  overlap_ms: [300, 900]
  backchannel_position: [0.3, 0.75]
  interruption_position: [0.35, 0.75]
  interrupted_tail_ms: [150, 500]
  cutoff_truncate_audio: true
  cutoff_position: [0.75, 0.95]
  enable_backchannels: true
  enable_interruptions: true
  enable_overlap: true

quality:
  validate_audio: true
  validate_dialogue: true
  reject_invalid: true

publishing:
  provider: huggingface
  private: true
  repository_id: manifestro/hohere-2m
  include_text: true
  token_env: HF_TOKEN
