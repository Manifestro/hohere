# Offline dry run: mock dialogue + mock TTS, no models or GPU needed.
# hohere default configuration. Every field is validated by hohere.config.schema.
# Omitted fields use schema defaults (see `uv run hohere init /tmp/full.yaml` for all of them).

project:
  name: hohere
  seed: 42
  dataset_version: 0.0.0-mock

dataset:
  target_hours: 0.1
  language: en
  output_dir: ./data/mock
  cache_dir: ./data/cache
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  estimated_conversation_seconds: 60
  overprovision: 1.15
  # Primary conversational skill of each dialogue -> share of total hours.
  skill_mix:
    simple_dialogue:     {share: 0.40, description: "Questions, answers, clarifications, short exchanges."}
    context_memory:      {share: 0.20, description: "Referring back to things said several turns earlier."}
    turn_taking:         {share: 0.15, description: "Varied pauses, hesitation, waiting for a reply."}
    backchannel:         {share: 0.10, description: "'mm-hm', 'right', 'I see' during the other's speech."}
    interruption:        {share: 0.10, description: "Stopping an answer, clarifying, changing direction."}
    incomplete_thoughts: {share: 0.05, description: "Self-correction, resuming an abandoned sentence."}
  # topics: [...]   # defaults to hohere/config/topics.py

dialogue:
  provider: mock
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  base_url: null            # or $HOHERE_QWEN_BASE_URL, e.g. http://localhost:8000/v1
  temperature: 0.9
  top_p: 0.95
  concurrency: 16
  max_attempts: 3
  min_turns: 4
  max_turns: 20
  max_words_per_utterance: 60
  min_duration_seconds: 20
  max_duration_seconds: 180
  near_duplicate_threshold: 0.6
  llm_judge: false

speech:
  provider: mock
  model: hexgrad/Kokoro-82M
  sample_rate: 24000
  device: null              # auto: cuda if available
  voices: [af_heart, af_bella, af_nicole, af_aoede, af_kore, af_sarah,
           am_michael, am_fenrir, am_puck, am_echo, am_eric, am_liam,
           bf_emma, bf_isabella, bm_george, bm_fable, bm_lewis]
  speed_min: 0.95
  speed_max: 1.05
  utterance_speed_jitter: 0.02
  trim_silence: true

timeline:
  lead_silence_ms: [200, 600]
  tail_silence_ms: [300, 800]
  normal_pause_ms: [200, 800]
  long_pause_ms: [1000, 2500]
  random_long_pause_prob: 0.05
  transition_overlap_prob: 0.08
  transition_overlap_ms: [50, 250]
  overlap_ms: [300, 900]
  backchannel_position: [0.3, 0.75]
  interruption_position: [0.35, 0.75]
  interrupted_tail_ms: [150, 500]
  cutoff_truncate_audio: true
  cutoff_position: [0.75, 0.95]
  enable_backchannels: true
  enable_interruptions: true
  enable_overlap: true

quality:
  validate_audio: true
  validate_dialogue: true
  reject_invalid: true

publishing:
  provider: huggingface
  private: true
  repository_id: null
  include_text: true
  token_env: HF_TOKEN
