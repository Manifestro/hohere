[project]
name = "hohere"
version = "2.0.0.dev0"
description = "Self-supervised speech dataset pipeline over Libri-Light: chunks, Mimi codes and syllable units."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bagzhan", email = "bagzhankarl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "typer>=0.12",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Part B: Mimi / WavLM / VAD models. Never installed by Part A.
models = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "moshi>=0.2.13",
    "onnxruntime",
    "silero-vad>=5.1",
    "scipy>=1.11",
]

[project.scripts]
hohere = "hohere.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party code is kept byte-for-byte: never lint or reformat it
extend-exclude = ["src/hohere/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: talks to a real model server or remote service (opt-in via HOHERE_RUN_EXTERNAL=1)",
]
